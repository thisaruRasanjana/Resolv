name: Eval Gate
on:
  pull_request:
    paths:
      - 'src/triage.py'
      - 'src/embedder.py'
      - 'src/indexer.py'
      - 'backtest/**'

jobs:
  # Job 1: Fast — runs on every qualifying PR
  unit-tests:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: python -m pytest tests/ -v

      - name: Lint
        run: ruff check src/ backtest/ tests/

