name: Eval Gate
on:
  pull_request:
    paths:
      - 'src/triage.py'
      - 'src/embedder.py'
      - 'backtest/**'

jobs:
  eval-backtest:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -e ".[dev]"
        
      - name: Install and Run Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b
          
      - name: Fetch Test Data
        run: python -m backtest.fetch --repo microsoft/vscode --limit 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run Backtest
        id: backtest
        run: |
          # Run the replay and grep out the recall metric
          OUTPUT=$(python -m backtest.replay --repo microsoft/vscode --limit 50)
          echo "$OUTPUT"
          
          # Extract Recall value
          RECALL=$(echo "$OUTPUT" | grep -o 'Recall: [0-9.]*' | awk '{print $2}')
          
          # We require at least 5% recall on this tiny dataset for the pipeline to pass
          MIN_RECALL=0.0500
          
          if [ $(echo "$RECALL < $MIN_RECALL" | bc) -eq 1 ]; then
            echo "::error::Recall ($RECALL) is below minimum threshold ($MIN_RECALL)"
            exit 1
          else
            echo "::notice::Recall ($RECALL) passed minimum threshold ($MIN_RECALL)"
          fi
