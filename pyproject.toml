[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolv"
version = "0.1.0"
description = "AI bot that triages new GitHub issues: detecting duplicates, suggesting labels, and linking related PRs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # HTTP client — used for GitHub API calls and the Ollama API
    "httpx>=0.27",
    # GitHub REST API pagination helper
    "PyGithub>=2.3",
    # Qdrant vector store client — must match server image in docker-compose.yml.
    # Client 1.19.x uses the query_points API which requires server >=1.10.
    "qdrant-client>=1.9",
    # SQLite async wrapper for the state store
    "aiosqlite>=0.20",
    # Structured JSON logging
    "structlog>=24.2",
    # Config from environment variables with .env file support
    "python-dotenv>=1.0",
    # Rich terminal output for the backtest report
    "rich>=13.7",
    # Phase 2: Webhook receiver
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Phase 2: Redis Streams queue
    "redis>=5.0",
    # Phase 2: GitHub App JWT auth
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
    # Phase 3: Observability
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mlflow>=2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
