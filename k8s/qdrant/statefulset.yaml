apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resolv-qdrant
  namespace: resolv
spec:
  serviceName: resolv-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.6
          ports:
            - containerPort: 6333
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resolv-qdrant
  namespace: resolv
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
