apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-server
  namespace: resolv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
    spec:
      containers:
        - name: webhook
          image: resolv:latest
          imagePullPolicy: Never  # We'll load the image directly into Kind
          command: ["python3", "-m", "uvicorn", "src.webhook:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: resolv-config
            - secretRef:
                name: resolv-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
